# Publishes to pub.dev when a version tag such as `v0.5.0` is pushed.
#
# Uses pub.dev automated publishing (OIDC), so no token is stored in the
# repository. Enable it first on pub.dev: package Admin tab > Automated
# publishing > GitHub Actions, repository `sajiths07/liquid_glass_ui`, tag
# pattern `v{{version}}`.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Verify tag matches pubspec version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version $version"
            exit 1
          fi
      - name: Test
        run: flutter test --timeout 60s
      - name: Dry run
        run: flutter pub publish --dry-run
      - name: Publish
        run: flutter pub publish --force
