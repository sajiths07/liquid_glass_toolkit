name: Feature request
description: Suggest a new widget, effect or option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like the API or behavior to look?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Screenshots, design references or links.
